# Flatpak manifest for Toots: Monster of the Rockies.
#
# This packages the already-exported game (build/toots.x86_64, made by
# tools/export.sh) rather than compiling anything, so build it with:
#
#     tools/export.sh && tools/build_flatpak.sh
#
app-id: io.github.tsloughter.Toots
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: toots

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  # GPU access, plus gamepads (which need raw input devices)
  - --device=all

build-options:
  # The game data is embedded in the executable; stripping it would corrupt it.
  strip: false
  no-debuginfo: true

modules:
  - name: toots
    buildsystem: simple
    build-commands:
      - install -Dm755 toots.x86_64 /app/bin/toots
      - install -Dm644 io.github.tsloughter.Toots.desktop -t /app/share/applications
      - install -Dm644 io.github.tsloughter.Toots.metainfo.xml -t /app/share/metainfo
      - |
        for size in 64 128 256 512; do
          install -Dm644 toots-$size.png \
            /app/share/icons/hicolor/${size}x${size}/apps/io.github.tsloughter.Toots.png
        done
    sources:
      - type: file
        path: ../build/toots.x86_64
      - type: file
        path: io.github.tsloughter.Toots.desktop
      - type: file
        path: io.github.tsloughter.Toots.metainfo.xml
      - type: dir
        path: icons
